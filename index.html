<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc nhỏ của Trâm 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffe6ee 0%, #ffccde 50%, #ffb6c1 100%);
            color: #5a3d48;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 3px solid #fff;
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4);
            text-align: center;
            position: relative;
            animation: fadeIn 1s ease-in-out;
        }

        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff9ebb;
            box-shadow: 0 8px 20px rgba(255, 158, 187, 0.4);
        }

        .badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #ff6b95;
            color: white;
            font-size: 18px;
            padding: 5px;
            border-radius: 50%;
            border: 2px solid white;
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            font-size: 26px;
            color: #ff407d;
            margin-bottom: 8px;
            font-weight: 700;
        }
